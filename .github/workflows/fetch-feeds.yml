name: Fetch feeds

# Fetches all type:"feed" sources (venue calendars: ICS / JSON-LD / Squarespace /
# NYC Parks RSS / Eventbrite organizer pages) and commits feed-events.json.
# This runs HERE, not in the cloud routine, because the routine's sandbox has
# restricted network egress — every outbound fetch 403s (observed 2026-07-02).
# Schedule: Tuesday 21:30 UTC, thirty minutes before the 22:00 UTC routine run,
# so the routine's fresh clone already contains today's feed data.
on:
  schedule:
    - cron: '30 21 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch feeds
        run: node bin/fetch-feeds.js
      - name: Commit feed-events.json if changed
        run: |
          git add feed-events.json
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "feeds: $(date -u +%Y-%m-%d)"
            git push
          fi
