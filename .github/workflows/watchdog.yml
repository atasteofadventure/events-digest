name: Digest watchdog

# Dead-man switch. Runs Friday 15:00 UTC (~11am ET), ~17 hours after the
# Thursday 22:00 UTC cloud-routine run. If no `digest:` commit landed in the
# last 40 hours, emails an alert — a silently failed routine (no digest, no
# email, no signal) is exactly how the 2026-06-25 miss went unnoticed.
on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — the check greps the commit log
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Alert if the digest is stale
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node bin/watchdog.js
