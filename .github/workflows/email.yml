name: Weekly digest email

# Sends the email-safe digest (digests/email.html) whenever a digest build is
# pushed. The cloud routine runs Tuesdays 22:00 UTC; a recovery/manual run on
# any other day now emails too — the `digest:` commit prefix is the guard, not
# the day of week. Trigger manually any time via the "Run workflow" button.
on:
  push:
    branches: [main]
    paths: ['digests/email.html']
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to send
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            MSG=$(git log -1 --pretty=%s)
            if printf '%s' "$MSG" | grep -q '^digest:'; then
              echo "send=true" >> "$GITHUB_OUTPUT"
            else
              echo "send=false" >> "$GITHUB_OUTPUT"
              printf 'Skipping send (event=push, msg=%s); only digest: pushes are emailed.\n' "$MSG"
            fi
          fi

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.send == 'true'
        with:
          node-version: '20'

      - name: Send the digest email
        if: steps.decide.outputs.send == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node bin/send-email.js
